<!DOCTYPE html>

<html lang="pt-br">
    <title>Cadastro de Usuários</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <h1>Manipulando Usuários</h1>
        </div>
        <button onclick="abrePage();">Entrar</button>
        <div>
           <form action="/aplicationFoo/servUsuario" method="post">
            <table>
                <tr><td>Nome:</td><td><input type="text" name="txtnome" value="" size="20" /></td></tr>
                <tr><td>Login:</td><td><input type="text" name="txtlogin" value="" size="20" /></td></tr>
                <tr><td>Senha:</td><td><input type="text" name="txtsenha" value="" size="6" /></td></tr>
            </table>
            <table>
                <tr>
                    <td><input type="submit" name="botao" value="Incluir"></td>
                    <td><input type="submit" name="botao" value="Excluir"></td>
                    <td><input type="submit" name="botao" value="Alterar"></td>
                    <td><input type="submit" name="botao" value="Consultar"></td>
                </tr>
            </table>
             </form>
        </div>
         <script type="text/javascript">
            function abrePage(){
               //alert("Acessar area restrita"); 
               window.location.href="login.html";
            }  
        </script>
    </body>
</html>
